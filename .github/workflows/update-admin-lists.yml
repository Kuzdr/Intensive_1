name: Update admin lists (Элементы)

on:
  schedule:
    # Раз в день в 05:30 UTC (08:30 мск). Списки админки «Элементов»
    # (в первую очередь «Место проведения») часто обновляются.
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: admin-lists
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Обновить списки из выпадающих списков «Элементов»
        run: python -X utf8 tools/update_admin_lists.py

      - name: Закоммитить изменения (если списки изменились)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Изменений нет."
          else
            git commit -m "Обновление списков админки «Элементов» (автоматически)"
            git push
          fi